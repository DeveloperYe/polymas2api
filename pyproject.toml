[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymas2api"
version = "0.1.0"
description = "Expose the polymas (智慧树 / Polymas) AI assistant 小真 as an OpenAI-compatible local API gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # zero runtime dependencies: pure standard library

[project.optional-dependencies]
dev = ["pytest>=7"]
# Exact token accounting. Without it the gateway estimates from character
# counts, which is 11-15% high on production prompts and 60-83% high on Chinese
# prose (measured 2026-11-26). The vocabularies are data files fetched by
# tools/fetch_tokenizers.py, not packaged here.
tokens = ["tokenizers>=0.23"]

[project.scripts]
polymas2api = "polymas2api.cli:main"

[tool.setuptools]
packages = ["polymas2api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
